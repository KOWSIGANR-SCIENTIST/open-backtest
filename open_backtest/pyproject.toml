[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-backtest"
version = "1.0.0"
description = "OpenBacktest.ai - AI-powered cryptocurrency backtesting platform."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kowsigan R", email = "kowsigananalyst@outlook.com" }
]
keywords = ["backtesting", "cryptocurrency", "trading", "AI", "ccxt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
    "requests>=2.31",
    "PySide6>=6.6",
    "plotly>=5.18",
    "ccxt>=4.0",
    "cryptography>=41.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.4"]

[project.urls]
Homepage = "https://kowsiganr.github.io"
Portfolio = "https://kowsiganr.github.io"

[project.scripts]
open_backtest = "open_backtest:main"
openbacktest  = "open_backtest:main"

[tool.setuptools]
py-modules = ["open_backtest"]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]